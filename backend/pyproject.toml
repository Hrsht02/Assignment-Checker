[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-academic-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "pymupdf==1.24.3",
    "paddleocr==2.7.3",
    "paddlepaddle==2.6.1",
    "google-generativeai==0.5.4",
    "sentence-transformers==3.0.0",
    "faiss-cpu==1.8.0",
    "langgraph==0.1.5",
    "langchain-core==0.2.5",
    "boto3==1.34.110",
    "resend==0.8.0",
    "celery[redis]==5.3.6",
    "redis==5.0.4",
    "openpyxl==3.1.2",
    "reportlab==4.2.0",
    "httpx==0.27.0",
    "apscheduler==3.10.4",
    "numpy==1.26.4",
    "pillow==10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]
